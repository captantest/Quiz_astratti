<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Ragionamento Astratto</title>
    <link rel="stylesheet" href="style.css">
    <!-- D3.js per visualizzazioni interattive -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container" id="app">
        <!-- Schermo introduttivo -->
        <div id="intro-screen" class="screen">
            <h1>Test di Logica</h1>
            <div class="settings">
                <label for="num-questions">Numero domande:</label>
                <select id="num-questions">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                </select>

                <label for="enable-timer">
                    <input type="checkbox" id="enable-timer"> Attiva timer per domanda
                </label>

                <label for="timer-duration" id="timer-duration-label">Durata (secondi):</label>
                <select id="timer-duration">
                    <option value="30">30</option>
                    <option value="60" selected>60</option>
                    <option value="90">90</option>
                </select>
            </div>
            <button id="start-btn" class="btn btn-primary">Inizia il test</button>
            <div id="high-score-display"></div>
        </div>

        <!-- Schermo del test -->
        <div id="quiz-screen" class="screen" style="display: none;">
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="question-area"></div>
            <div id="options-container"></div>
            <div id="timer-display" class="timer"></div>
            <div id="feedback" class="feedback"></div>
            <div class="buttons">
                <button id="help-btn" class="btn btn-outline">Mostra soluzione</button>
                <button id="quit-btn" class="btn btn-stop">Termina test</button>
            </div>
        </div>

        <!-- Schermo risultati -->
        <div id="result-screen" class="screen" style="display: none;">
            <h2>Test completato</h2>
            <div id="final-score"></div>
            <div id="performance-stats"></div>
            <button id="restart-btn" class="btn btn-primary">Ricomincia</button>
        </div>
    </div>

    <!-- Caricamento dei moduli in ordine di dipendenza -->
    <script src="data.js"></script>
    <script src="quizGenerator.js"></script>
    <script src="uiManager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = new QuizApp();
        });
    </script>
</body>
</html>
